<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380" role="img" aria-labelledby="title desc">
<title id="title">VOLTRA Echo illustrated architecture</title>
<desc id="desc">Educational reference workflow, not proof of hardware operation.</desc>
<rect width="960" height="380" rx="20" fill="#0b111b"/>
<g font-family="Segoe UI,Arial,sans-serif">
<text x="36" y="42" fill="#7cd7f7" font-size="18" letter-spacing="5">VOLTRA</text>
<text x="36" y="95" fill="#ecf2f7" font-size="40" font-weight="700">Echo</text>
<text x="36" y="132" fill="#a2b2c5" font-size="21">A reading is only useful when it is valid.</text>
<rect x="36" y="173" width="280" height="117" rx="12" fill="#121e2b" stroke="#7cd7f7"/>
<text x="54" y="200" fill="#7cd7f7" font-size="16">01</text>
<text x="54" y="231" fill="#ecf2f7" font-size="20" font-weight="600">Receive an echo</text>
<text x="54" y="263" fill="#a2b2c5" font-size="13">Optional trigger/echo sensor adapter</text>
<path d="M322 230h12m-4-4 4 4-4 4" fill="none" stroke="#7cd7f7" stroke-width="2"/>
<rect x="340" y="173" width="280" height="117" rx="12" fill="#121e2b" stroke="#7cd7f7"/>
<text x="358" y="200" fill="#7cd7f7" font-size="16">02</text>
<text x="358" y="231" fill="#ecf2f7" font-size="20" font-weight="600">Reject and filter</text>
<text x="358" y="263" fill="#a2b2c5" font-size="13">Timeout + range checks + fresh median</text>
<path d="M626 230h12m-4-4 4 4-4 4" fill="none" stroke="#7cd7f7" stroke-width="2"/>
<rect x="644" y="173" width="280" height="117" rx="12" fill="#121e2b" stroke="#7cd7f7"/>
<text x="662" y="200" fill="#7cd7f7" font-size="16">03</text>
<text x="662" y="231" fill="#ecf2f7" font-size="20" font-weight="600">Show a valid state</text>
<text x="662" y="263" fill="#a2b2c5" font-size="13">Expire stale data; never hide failure</text>
<text x="36" y="335" fill="#a2b2c5" font-size="16">Illustrated reference workflow. Hardware commissioning and measurements remain pending.</text>
</g></svg>
